name: CI

permissions:
  contents: read

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Install scripts must run here: Helia pulls @libp2p/webrtc, whose
      # node-datachannel binary is required to import the module at all.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Build
        run: npm run build

      - name: Build tests
        run: npm run test:build

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration
